name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Instalar IA local (opcional)
        run: python -m pip install -r requirements-ai.txt
        continue-on-error: true

      - name: Descargar ExifTool
        run: python scripts/download_exiftool.py

      - name: Empaquetar con PyInstaller
        run: pyinstaller metaverificador.spec --clean --noconfirm

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: MetaVerificador-Windows
          path: dist/MetaVerificador.exe
