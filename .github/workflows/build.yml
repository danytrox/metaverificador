name: build-windows

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      with_ai:
        description: "Incluir IA local (llama-cpp-python) en el .exe"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Instalar IA local (opcional)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.with_ai == 'true')
        run: python -m pip install -r requirements-ai.txt
        continue-on-error: true

      - name: Descargar ExifTool
        run: python scripts/download_exiftool.py

      - name: Empaquetar con PyInstaller
        run: pyinstaller metaverificador.spec --clean --noconfirm

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v7
        with:
          name: MetaVerificador-Windows${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.with_ai == 'true')) && '-IA' || '' }}
          path: dist/MetaVerificador.exe

      - name: Crear release de GitHub con el ejecutable
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/MetaVerificador.exe" --generate-notes --title "MetaVerificador ${{ github.ref_name }}"
